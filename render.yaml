services:
  - type: web
    name: upi-payment-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    pythonVersion: 3.11.11
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: upi_system
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@Fin_UPI.com
